{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hospital Login</title>
    <link rel="stylesheet" href="{% static 'accounts/Login.css' %}">
</head>

<body>

    <div class="screen">
        <div class="welcome-page">
            <img src="images\Logo.png" alt="our logo">
            <h1>Welcome</h1>
        </div>
        <div class="login-container">
            <h1 class='title_login'>Hospital Login</h1>
            <form method="POST">
                {% csrf_token %}
                <label for="username">Email / Username:</label>
                <div class="input_field">
                    <input type="text" id="username" name="username" required>
                    <img src="images\user.png" alt="Logo" class="icon">
                </div>

                <label for="password">Password:</label>
                <div class="input_field">
                    <input type="password" id="password" name="password" required>
                    <img src="images\padlock.png" alt="Logo" class="icon">
                </div>

                <label for="role">Login as:</label>
                <select id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Login</button>
            </form>

            <div class="footer-links">
                <p><a href="#">Forgot Password?</a></p>
                <p>Don't have an account? <a href="{%url 'register_doctor'%}">Register here</a></p>
            </div>
        </div>
    </div>
</body>

</html>
