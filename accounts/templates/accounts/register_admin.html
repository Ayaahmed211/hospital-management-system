{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Registration</title>
    <link rel="stylesheet" href="{% static 'accounts/register_admin.css' %}">
</head>

<body>

    <div class="screen">
        <div class="register">
            <h1>Admin Registration</h1>
            <form method="POST">
                {% csrf_token %}
                <label>Full Name:</label>
                <div class="input_field">
                    <input type="text" name="full_name" required placeholder="Enter Your Name ">
                </div>

                <label>Email:</label>
                <div class="input_field">
                    <input type="email" name="email" required placeholder="Name@example.com">
                </div>
                <label>Password:</label>
                <div class="input_field">
                    <input type="password" name="password1" required placeholder="Your Password">
                </div>
                <label>Confirm Password:</label>
                <div class="input_field">
                    <input type="password" name="password2" required placeholder="Confirm Your Password">
                </div>

                <label>Verification Code:</label>
                <div class="input_field">
                    <input type="text" name="verification_code" required placeholder="Enter Verification Code">
                </div>
                <button type="submit">Register</button>
            </form>
        </div>

        <img href='images/hospital.jpg' class="imagediv">
    </div>



</body>

</html>
